name: Publish site to gh-pages

# GitHub Pages serves the site from the gh-pages branch.
# Every push to main copies the latest version there.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push main to gh-pages
        run: git push --force origin HEAD:refs/heads/gh-pages
      - name: Turn on GitHub Pages (gh-pages branch) if it is off
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            echo "Pages already enabled"
          else
            gh api -X POST "repos/${{ github.repository }}/pages" \
              -f "source[branch]=gh-pages" -f "source[path]=/"
          fi
